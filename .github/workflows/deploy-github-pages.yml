# Деплой Vite → GitHub Pages (ветка main).
# Secrets: VITE_API_BASE_URL, VITE_ADMIN_EMAIL, VITE_GOOGLE_PLACES_API_KEY
# Settings → Pages → Source must be "GitHub Actions"
#
# Сайт: https://<user>.github.io/<repo>/
# User site: Variables → VITE_BASE_PATH = /

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Фиксирует Source=GitHub Actions; без этого deploy часто вечно сидит в deployment_queued
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_ADMIN_EMAIL: ${{ secrets.VITE_ADMIN_EMAIL }}
          VITE_GOOGLE_PLACES_API_KEY: ${{ secrets.VITE_GOOGLE_PLACES_API_KEY }}
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || format('/{0}/', github.event.repository.name) }}
        run: npm run build

      - name: Copy static HTML docs into dist
        run: |
          set -e
          cp docs/budget-2030.html dist/budget-2030.html
          cp "docs/budget-2030 copy.html" dist/budget-2030-copy.html
          if [ -f docs/todo.html ]; then
            cp docs/todo.html dist/todo.html
          else
            echo "docs/todo.html not in repo — skip"
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
