# Деплой Vite → ветка gh-pages (без actions/deploy-pages — тот часто зависает в deployment_queued).
#
# Один раз вручную:
#   Settings → Pages → Build and deployment → Source: Deploy from a branch
#   Branch: gh-pages / (root) → Save
#
# Secrets: VITE_API_BASE_URL, VITE_ADMIN_EMAIL, VITE_GOOGLE_PLACES_API_KEY

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_ADMIN_EMAIL: ${{ secrets.VITE_ADMIN_EMAIL }}
          VITE_GOOGLE_PLACES_API_KEY: ${{ secrets.VITE_GOOGLE_PLACES_API_KEY }}
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || format('/{0}/', github.event.repository.name) }}
        run: npm run build

      - name: Copy static HTML docs into dist
        run: |
          set -e
          cp docs/budget-2030.html dist/budget-2030.html
          cp "docs/budget-2030 copy.html" dist/budget-2030-copy.html
          cp docs/budget-2030-russia.html dist/budget-2030-russia.html
          if [ -f docs/todo.html ]; then
            cp docs/todo.html dist/todo.html
          else
            echo "docs/todo.html not in repo — skip"
          fi
          # SPA fallback на GitHub Pages
          cp dist/index.html dist/404.html

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
          commit_message: 'deploy: ${{ github.sha }}'
