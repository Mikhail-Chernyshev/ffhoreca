<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Tips from trips">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f8f7fc"/>
      <stop offset="1" stop-color="#f0eef8"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#6d28d9" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- subtle map grid -->
  <g opacity="0.06" stroke="#6d28d9" stroke-width="1">
    <path d="M0 315h1200M600 0v630"/>
    <circle cx="600" cy="315" r="180" fill="none"/>
    <circle cx="600" cy="315" r="280" fill="none"/>
  </g>

  <g transform="translate(600 300)" filter="url(#soft-shadow)">
    <!-- lockup scaled ~3.2x from 228x40 -->
    <g transform="translate(-365 -64) scale(3.2)">
      <rect width="40" height="40" rx="10" fill="url(#badge)"/>
      <text
        x="20"
        y="25.5"
        text-anchor="middle"
        fill="#fff"
        font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="13"
        font-weight="700"
        letter-spacing="0.06em"
      >TFT</text>
      <path
        fill="none"
        stroke="#fbbf24"
        stroke-width="1.5"
        stroke-linecap="round"
        d="M9 33.5c2.6-1.8 4.4-2.3 6.5-2.3s3.9.5 6.5 2.3"
      />
      <text
        x="50"
        y="26"
        fill="#1a1a2e"
        font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="17"
        font-weight="600"
        letter-spacing="-0.03em"
      >Tips from trips</text>
    </g>
  </g>

  <text
    x="600"
    y="420"
    text-anchor="middle"
    fill="#5c5670"
    font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
    font-size="28"
    font-weight="500"
  >Personal travel map</text>
</svg>
